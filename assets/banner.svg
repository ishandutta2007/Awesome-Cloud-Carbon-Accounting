<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#064e3b"/><stop offset="100%" stop-color="#022c22"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="50%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse-wave{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.05) translate(-10px,5px);opacity:.6}}@keyframes float-pill{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.stat-lbl,.stat-val,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#a7f3d0}.badge-text{font-weight:600;font-size:13px;fill:#6ee7b7}.stat-val{font-weight:700;font-size:22px;fill:#fff}.stat-lbl{font-weight:400;font-size:12px;fill:#9ca3af}.wave-bg{animation:pulse-wave 8s ease-in-out infinite;transform-origin:center}.floating-card-1{animation:float-pill 5s ease-in-out infinite}.floating-card-2{animation:float-pill 6s ease-in-out infinite 1s}.flow-line{stroke-dasharray:8,8;animation:dash-flow 2s linear infinite}</style><rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/><g class="wave-bg"><path fill="none" stroke="#10b981" stroke-opacity=".15" stroke-width="4" d="M-50,200 Q200,80 500,220 T1100,120 T1300,250"/><path fill="none" stroke="#34d399" stroke-opacity=".1" stroke-width="2" d="M-50,230 Q250,120 550,250 T1150,160 T1300,280"/><circle cx="200" cy="130" r="4" fill="#34d399" opacity=".4"/><circle cx="500" cy="220" r="6" fill="#10b981" opacity=".5"/><circle cx="800" cy="140" r="5" fill="#6ee7b7" opacity=".4"/></g><g><g class="floating-card-1" transform="translate(820, 45)"><rect width="320" height="90" fill="url(#card-grad)" stroke="#10b981" stroke-opacity=".3" stroke-width="1" rx="12"/><text x="20" y="32" class="stat-lbl">ESTIMATED MARKET SIZE</text><text x="20" y="62" class="stat-val">$18.5 Billion</text><text x="220" y="62" fill="#34d399" class="badge-text">+22.4% CAGR</text></g><g class="floating-card-2" transform="translate(820, 45) translate(0, 110)"><rect width="320" height="100" fill="url(#card-grad)" stroke="#34d399" stroke-opacity=".2" stroke-width="1" rx="12"/><text x="20" y="30" class="stat-lbl">REPORTING SCOPES COVERED</text><text x="20" y="60" class="stat-val">Scope 1 · 2 · 3</text><path stroke="#374151" stroke-width="2" d="M20,78 L300,78"/><path stroke="url(#accent-grad)" stroke-linecap="round" stroke-width="4" d="M20,78 L230,78"/><text x="238" y="73" class="stat-lbl" font-size="10">85% Scope 3 Data</text></g></g><g><g transform="translate(60, 65) translate(0, 0)"><rect width="260" height="30" fill="#064e3b" stroke="#10b981" stroke-width="1" rx="15"/><circle cx="15" cy="15" r="4" fill="#34d399"/><text x="28" y="20" class="badge-text">🌱 ECOSYSTEM &amp; PLATFORMS</text></g><text x="0" y="85" class="title" transform="translate(60, 65)">Awesome Cloud <tspan fill="url(#accent-grad)">Carbon Accounting</tspan></text><text x="0" y="125" class="subtitle" transform="translate(60, 65)">Enterprise SaaS &amp; Open-Source GHG Emissions Platforms</text><g transform="translate(60, 65) translate(0, 145)"><line x1="0" x2="450" y1="0" y2="0" stroke="#10b981" stroke-opacity=".4" stroke-width="2" class="flow-line"/><text x="0" y="25" class="stat-lbl">CSRD · ISSB · CDP · GHG PRO