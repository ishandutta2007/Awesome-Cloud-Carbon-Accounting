<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #a7f3d0; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #6ee7b7; }
    .stat-val { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 22px; fill: #ffffff; }
    .stat-lbl { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #9ca3af; }

    /* Animated background elements */
    @keyframes pulse-wave {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.05) translate(-10px, 5px); opacity: 0.6; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
    }
    @keyframes float-pill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    .wave-bg { animation: pulse-wave 8s ease-in-out infinite; transform-origin: center; }
    .floating-card-1 { animation: float-pill 5s ease-in-out infinite; }
    .floating-card-2 { animation: float-pill 6s ease-in-out infinite 1s; }
    .flow-line { stroke-dasharray: 8, 8; animation: dash-flow 2s linear infinite; }
  </style>

  <!-- Base Layer Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Geometric Waves & Nodes (Behind Content) -->
  <g class="wave-bg">
    <path d="M-50,200 Q200,80 500,220 T1100,120 T1300,250" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="4"/>
    <path d="M-50,230 Q250,120 550,250 T1150,160 T1300,280" fill="none" stroke="#34d399" stroke-opacity="0.1" stroke-width="2"/>
    <circle cx="200" cy="130" r="4" fill="#34d399" opacity="0.4"/>
    <circle cx="500" cy="220" r="6" fill="#10b981" opacity="0.5"/>
    <circle cx="800" cy="140" r="5" fill="#6ee7b7" opacity="0.4"/>
  </g>

  <!-- Right Side Dynamic Data Visualization (Background Visuals) -->
  <g transform="translate(820, 45)">
    <!-- Tech/ESG Interactive Card 1 -->
    <g class="floating-card-1">
      <rect width="320" height="90" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="20" y="32" class="stat-lbl">ESTIMATED MARKET SIZE</text>
      <text x="20" y="62" class="stat-val">$18.5 Billion</text>
      <text x="220" y="62" class="badge-text" fill="#34d399">+22.4% CAGR</text>
    </g>

    <!-- Tech/ESG Interactive Card 2 -->
    <g class="floating-card-2" transform="translate(0, 110)">
      <rect width="320" height="100" rx="12" fill="url(#card-grad)" stroke="#34d399" stroke-opacity="0.2" stroke-width="1"/>
      <text x="20" y="30" class="stat-lbl">REPORTING SCOPES COVERED</text>
      <text x="20" y="60" class="stat-val">Scope 1 · 2 · 3</text>
      <path d="M20,78 L300,78" stroke="#374151" stroke-width="2"/>
      <path d="M20,78 L230,78" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round"/>
      <text x="238" y="73" class="stat-lbl" font-size="10">85% Scope 3 Data</text>
    </g>
  </g>

  <!-- Foreground Title and Subtitle Content (Always On Top & Clear) -->
  <g transform="translate(60, 65)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <circle cx="15" cy="15" r="4" fill="#34d399"/>
      <text x="28" y="20" class="badge-text">🌱 ECOSYSTEM &amp; PLATFORMS</text>
    </g>

    <!-- Main Title with Glowing Accent -->
    <text x="0" y="85" class="title">
      Awesome Cloud <tspan fill="url(#accent-grad)">Carbon Accounting</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">
      Enterprise SaaS &amp; Open-Source GHG Emissions Platforms
    </text>

    <!-- Dynamic Flow Indicator Line -->
    <g transform="translate(0, 145)">
      <line x1="0" y1="0" x2="450" y2="0" stroke="#10b981" stroke-opacity="0.4" stroke-width="2" class="flow-line"/>
      <text x="0" y="25" class="stat-lbl">CSRD · ISSB · CDP · GHG PROTOCOL COMPLIANT</text>
    </g>
  </g>
</svg>
